<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour toi, mon amour ❤️</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1, #ff1493); /* Fond rose vibrant */
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
            color: white;
            overflow: auto;
        }
        .background-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1; /* Derrière tout */
        }
        .bg-heart {
            position: absolute;
            color: rgba(255, 20, 147, 0.3); /* Cœurs semi-transparents qui restent */
            font-size: 30px;
            animation: gentleFloat 10s infinite ease-in-out; /* Mouvement doux, ils restent visibles */
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: #ff1493;
            font-size: 24px;
            animation: float 8s infinite linear;
        }
        .phrase {
            position: absolute;
            color: #ffd700; /* Doré pour les phrases */
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            animation: phraseFloat 12s infinite ease-in-out; /* Flotte et s'efface */
            opacity: 0;
        }
        .sparkle {
            position: absolute;
            color: #ffd700;
            font-size: 16px;
            animation: sparkleFloat 5s infinite ease-in-out;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ff69b4, #ff1493);
            border-radius: 50%;
            animation: confettiFall 6s infinite linear;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg) scale(1); }
            50% { transform: translateY(50vh) rotate(180deg) scale(1.2); }
            100% { transform: translateY(-100vh) rotate(360deg) scale(1); }
        }
        @keyframes phraseFloat {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
        @keyframes sparkleFloat {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateY(-20px) scale(1.5); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        img {
            max-width: 80%;
            height: auto;
            border: 5px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }
        img:hover {
            transform: scale(1.05);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        .music {
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="background-hearts">
        <!-- Cœurs statiques sur le fond qui restent -->
        <div class="bg-heart" style="left: 10%; top: 20%;">❤️</div>
        <div class="bg-heart" style="left: 30%; top: 40%;">💖</div>
        <div class="bg-heart" style="left: 50%; top: 60%;">❤️</div>
        <div class="bg-heart" style="left: 70%; top: 30%;">💕</div>
        <div class="bg-heart" style="left: 90%; top: 50%;">❤️</div>
    </div>
    <div class="hearts">
        <!-- Cœurs flottants qui survolent -->
        <div class="heart" style="left: 5%; animation-delay: 0s;">❤️</div>
        <div class="heart" style="left: 15%; animation-delay: 0.5s;">💖</div>
        <div class="heart" style="left: 25%; animation-delay: 1s;">❤️</div>
        <div class="heart" style="left: 35%; animation-delay: 1.5s;">💕</div>
        <div class="heart" style="left: 45%; animation-delay: 2s;">❤️</div>
        <div class="heart" style="left: 55%; animation-delay: 2.5s;">💖</div>
        <div class="heart" style="left: 65%; animation-delay: 3s;">❤️</div>
        <div class="heart" style="left: 75%; animation-delay: 3.5s;">💕</div>
        <div class="heart" style="left: 85%; animation-delay: 4s;">❤️</div>
        <div class="heart" style="left: 95%; animation-delay: 4.5s;">💖</div>
        <!-- Phrases flottantes qui s'effacent -->
        <div class="phrase" style="left: 20%; animation-delay: 0s;">je t'aime</div>
        <div class="phrase" style="left: 40%; animation-delay: 2s;">mes jours sont meilleurs à tes cotés</div>
        <div class="phrase" style="left: 60%; animation-delay: 4s;">tu es incroyable</div>
        <div class="phrase" style="left: 80%; animation-delay: 6s;">tu es ravissant</div>
        <div class="phrase" style="left: 10%; animation-delay: 8s;">tu es sublime</div>
        <div class="phrase" style="left: 30%; animation-delay: 10s;">tu es magnifique</div>
        <div class="phrase" style="left: 50%; animation-delay: 12s;">tu es drole</div>
        <div class="phrase" style="left: 70%; animation-delay: 14s;">l'amour de ma vie</div>
        <!-- Étincelles -->
        <div class="sparkle" style="left: 20%; top: 30%; animation-delay: 0s;">✨</div>
        <div class="sparkle" style="left: 60%; top: 50%; animation-delay: 1s;">✨</div>
        <div class="sparkle" style="left: 80%; top: 70%; animation-delay: 2s;">✨</div>
        <!-- Confettis -->
        <div class="confetti" style="left: 10%; animation-delay: 0s;"></div>
        <div class="confetti" style="left: 30%; animation-delay: 1s;"></div>
        <div class="confetti" style="left: 50%; animation-delay: 2s;"></div>
        <div class="confetti" style="left: 70%; animation-delay: 3s;"></div>
        <div class="confetti" style="left: 90%; animation-delay: 4s;"></div>
    </div>
    <h1>Joyeuse Saint-Valentin, mon amour ! ❤️✨</h1>
    <img src=https://i.imgur.com/pVw5jDr.png alt="Mon image pour toi">
    <div class="music">
        <h2>Écoute cette chanson pour toi 💕</h2>
       <iframe width="300" height="200" src="https://www.youtube.com/embed/iUnf7uuuCBk?si=0Dmm1DiOIBn6uu-z" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
